<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한자 찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f1e7;--panel:#fffdf8;--ink:#23201b;--mute:#7a7266;--line:#ddd3c0;--accent:#b3261e;--accent2:#2d5a4a}
  @media (prefers-color-scheme:dark){:root{--bg:#171512;--panel:#201d19;--ink:#efe8da;--mute:#a39a8a;--line:#3a352d;--accent:#ef7b72;--accent2:#7fc4a8}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Serif KR",serif;font-weight:700;padding:12px}
  .app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:0;display:flex;flex-direction:column}
  .left{grid-row:1/3}
  h2{margin:0 0 8px;font-size:20px;color:var(--mute);font-weight:700;letter-spacing:.08em}
  #pad{flex:1;min-height:0;position:relative;border:1px dashed var(--line);border-radius:10px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;font-size:22px}
  .cands{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:34px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:21px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .bar{display:flex;gap:8px;margin-top:10px}
  button.btn{flex:1;white-space:nowrap;padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:22px;cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn .ico{width:1.3em;height:1.3em;vertical-align:-.25em}
  .mode{flex-wrap:nowrap;white-space:nowrap}
  .mode .gap{margin-left:10px}
  .mode #grades{display:flex;gap:4px;margin:0}
  .mode .seg{padding:2px 10px;font-size:19px}
  .mode span{font-size:16px}
  .bar{gap:8px}
  button.btn{flex:1 1 0;min-width:0;font-size:24px;padding:14px 4px}
  .mode{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:18px;color:var(--mute)}
  .seg{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 14px;font:inherit;font-size:21px;cursor:pointer}
  .seg.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .gc{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:36px;line-height:1.1}
  .gc small{font-size:20px;color:var(--mute)} .gc i{font-style:normal;font-size:28px}
  .gc:hover{border-color:var(--accent)}
  .badge{display:inline-block;background:var(--accent2);color:#fff;border-radius:999px;padding:0 12px;font-size:.7em;margin-left:8px}
  #status{font-size:18px;color:var(--mute);margin-top:6px;min-height:16px}
  .hanja{align-items:center;justify-content:center;text-align:center}
  #big{font-family:"Noto Serif TC","Noto Serif KR",serif;font-weight:700;font-size:clamp(84px,19vw,225px);line-height:1.1;letter-spacing:.04em;color:var(--accent);word-break:keep-all}
  .hrow{display:flex;align-items:center;justify-content:center;gap:.2em;flex-wrap:nowrap;white-space:nowrap;font-size:120px;max-width:100%}
  .hrow #big{font-size:1em}
  #pic{font-size:.6em;flex:none;line-height:1;min-height:0}
  #pic:empty{display:none}
  .info li small{font-size:.8em;color:var(--mute)}
  #reading{font-size:30px;margin-top:6px}
  #chars{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:20px;color:var(--mute)}
  #chars b{font-family:"Noto Serif TC",serif;font-size:30px;color:var(--ink);font-weight:500}
  .info{overflow:auto}
  .info p{margin:0 0 10px;line-height:1.7;font-size:22px}
  .info ul{margin:0 0 8px;padding-left:22px;line-height:1.55;font-size:22px}
  .info ul.cols{columns:180px 3;column-gap:22px}
  .info li{break-inside:avoid;white-space:nowrap}
  .info p{margin:0 0 6px}
  .hrow{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hrow:active{transform:scale(.97)}
  .vox{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:18px;color:var(--mute)}
  .vox label{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .vox input{width:130px;accent-color:var(--accent2);height:28px}
  .vox b{min-width:2.2em;color:var(--ink)}
  #listen{font-size:18px;color:var(--mute);margin-top:2px;cursor:pointer}
  .tag{font-size:18px;color:var(--accent2);margin-bottom:2px}
  .placeholder{color:var(--mute)}
  .loading{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (max-width:900px){
    body{padding:8px}.app{grid-template-columns:1fr;grid-template-rows:1.7fr 1.1fr 1fr;gap:8px}.left{grid-row:auto}
  }
</style>
</head>
<body>
<div class="app">
  <section class="panel left">
    <h2>필기 · 음성 입력</h2>
    <div id="pad"><canvas id="cv"></canvas><div id="hint">여기에 한자를 써 보세요 (예: 人, 學校)</div></div>
    <div class="cands" id="cands"></div>
    <div id="status"></div>
    <div class="mode" id="mode"><span>글자</span><button class="seg on" data-m="zh">漢字</button><button class="seg" data-m="ko">한글</button><span class="gap">급수</span><span id="grades"><button class="seg" data-g="8">8급</button><button class="seg" data-g="7">7급</button><button class="seg" data-g="6">6급</button></span></div>
    <div class="bar">
      <button class="btn" id="bWrite">✍️ 필기</button>
      <button class="btn" id="bRec">🎙️ 녹음</button>
      <button class="btn" id="bStop">⏹ 중지</button>
      <button class="btn" id="bClear" title="지우기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.2 3.3a2 2 0 0 1 2.8 0l1.7 1.7a2 2 0 0 1 0 2.8L11 17.5H6.2L3.3 14.6a2 2 0 0 1 0-2.8z" fill="#f4a3b5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.3 6.2l8.5 8.5" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 17.5H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> 지우기</button>
    </div>
  </section>

  <section class="panel hanja">
    <div class="hrow"><div id="big" class="placeholder">漢字</div><div id="pic"></div></div>
    <div id="reading"></div>
    <div id="listen">🔊 한자를 누르면 읽어줘요</div>
    <div class="vox">
      <label>🐢 속도 <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.8"><b id="rateV">0.8</b></label>
      <label>🔈 크기 <input type="range" id="vol" min="0.2" max="1" step="0.1" value="1"><b id="volV">1.0</b></label>
    </div>
    <div id="chars"></div>
  </section>

  <section class="panel info" id="info">
    <h2>뜻과 쓰임</h2>
    <p class="placeholder">한자를 쓰거나 말하면 훈·음과 쓰임이 여기에 나옵니다. 아래 ‘급수’ 버튼으로 8·7·6급 한자를 골라 볼 수도 있어요..</p>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let strokes = [], cur = null, t0 = 0, drawing = false;

function fit(){
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d,0,0,d,0,0); redraw();
}
function redraw(){
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.body).color;
  for (const s of strokes){
    ctx.beginPath();
    s[0].forEach((x,i)=> i ? ctx.lineTo(x,s[1][i]) : ctx.moveTo(x,s[1][i]));
    if (s[0].length === 1) ctx.lineTo(s[0][0]+.1, s[1][0]);
    ctx.stroke();
  }
}
addEventListener('resize', fit); fit();

function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); drawing = true; $('hint').style.display = 'none';
  if (!t0) t0 = performance.now();
  const [x,y] = pos(e); cur = [[x],[y],[Math.round(performance.now()-t0)]]; strokes.push(cur); redraw();
});
cv.addEventListener('pointermove', e=>{
  if (!drawing) return;
  const [x,y] = pos(e); cur[0].push(x); cur[1].push(y); cur[2].push(Math.round(performance.now()-t0)); redraw();
});
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, ()=>{ drawing = false; }));

function clearPad(){ strokes = []; t0 = 0; redraw(); $('hint').style.display = ''; $('cands').innerHTML = ''; }
$('bClear').onclick = clearPad;

function setStatus(s){ $('status').textContent = s || ''; }

// --- 필기 인식 ---
let mode = 'zh';
document.querySelectorAll('.seg').forEach(b=> b.onclick = ()=>{
  mode = b.dataset.m; document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('on', x===b));
  $('hint').textContent = mode==='ko' ? '여기에 한글 낱말을 써 보세요 (예: 학교)' : '여기에 한자를 써 보세요 (예: 人, 學校)';
  if (strokes.length) $('bWrite').click();
});
const ENGINE = { ko:['ko-t-i0-handwrit','ko'], zh:['zh-hant-t-i0-handwrit','zh_TW'] };
$('bWrite').onclick = async ()=>{
  if (!strokes.length){ setStatus('먼저 왼쪽 칸에 글씨를 써 주세요.'); return; }
  setStatus('필기를 인식하는 중…');
  const r = cv.getBoundingClientRect(), [itc, language] = ENGINE[mode];
  try{
    const res = await fetch(`https://inputtools.google.com/request?itc=${itc}&app=hanja`,{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:Math.round(r.width),writing_area_height:Math.round(r.height)},ink:strokes,language,max_num_results:10}]})});
    const raw = await res.json();
    if (raw[0] !== 'SUCCESS') throw new Error('인식 실패');
    const c = raw[1]?.[0]?.[1] || [];
    $('cands').innerHTML = '';
    c.forEach(w=>{ const b = document.createElement('button'); b.className='chip'; b.textContent = w; b.onclick = ()=>lookup(w); $('cands').appendChild(b); });
    await dictReady;
    const known = x => mode==='zh' ? [...x].length && [...x].every(h=>CH[h]) : found(x);
    const hit = c.find(known);
    const pick = hit || c.find(x=>clean(x)) || c[0];
    if (!pick){ setStatus('글씨를 알아보지 못했어요. 다시 써 주세요.'); return; }
    if (mode === 'zh' && hit !== c[0]){
      const items = [...new Set(c.flatMap(x=>[...x]).filter(h=>CH[h]))].slice(0,6).map(h=>({h, label: mainMeaning(h)}));
      if (items.length){ setStatus(`인식: ${c[0] || ''}`); return similarFlow(items); }
    }
    setStatus(`인식: ${pick}` + (hit ? '' : mode==='ko' ? ' (사전에 없어요. 한자를 쓰셨다면 「漢字」 모드로 바꿔 보세요)' : ' (사전에 없는 글자예요)'));
    lookup(pick);
  }catch(e){ setStatus('오류: ' + e.message); }
};

// --- 음성 인식 ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = '', alts = [];
$('bRec').onclick = ()=>{
  if (!SR){ setStatus('이 브라우저는 음성 인식을 지원하지 않아요. 크롬/엣지/사파리를 써 주세요.'); return; }
  if (rec) return;
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 5; finalText = ''; alts = [];
  rec.onstart = ()=>{ $('bRec').classList.add('on'); $('bRec').textContent = '🎙️ 듣는 중…'; setStatus('말씀하세요…'); };
  rec.onresult = e=>{
    let t = ''; for (const r of e.results){ t += r[0].transcript; if (r.isFinal){ finalText = t; alts = [...r].map(a=>a.transcript); } }
    setStatus('듣는 중: ' + t);
  };
  rec.onerror = e=> setStatus('음성 오류: ' + e.error);
  rec.onend = async ()=>{
    $('bRec').classList.remove('on'); $('bRec').textContent = '🎙️ 녹음'; rec = null;
    await dictReady;
    const cand = [finalText, ...alts].map(x=>x.trim()).filter(Boolean);
    const w = cand.find(x=>{ const c = clean(x); return c && ([...c].every(isH) || findMatch(c)); }) || cand[0];
    if (w){ setStatus(`인식: ${w}`); lookup(w); }
  };
  rec.start();
};
$('bStop').onclick = ()=>{ if (rec) rec.stop(); else setStatus('녹음 중이 아니에요.'); };

// --- 한자 조회 (내장 사전, 무료) ---
let CH = null, WD = null, RELIDX = null, GR = null, LV = {};
const GRADE_OF = {};
const common = h => LV[h] ?? -1;   // 클수록 흔한 글자(8급=8 … 특급=0, 사전 밖=-1)
const dictReady = Promise.all([
  fetch('dict/chars.json').then(r=>r.json()), fetch('dict/words.json').then(r=>r.json()), fetch('dict/grades.json').then(r=>r.json()), fetch('dict/levels.json').then(r=>r.json())
]).then(([c,w,g,lv])=>{ CH = c; WD = w; GR = g; LV = lv; for (const k in g) for (const x of g[k]) GRADE_OF[x.h] = +k; setStatus(''); });
setStatus('사전을 불러오는 중…');


// --- 그림(이모지) ---
const EMO = {一:'1️⃣',二:'2️⃣',三:'3️⃣',四:'4️⃣',五:'5️⃣',六:'6️⃣',七:'7️⃣',八:'8️⃣',九:'9️⃣',十:'🔟',百:'💯',
人:'🧑',大:'🐘',小:'🐜',上:'⬆️',下:'⬇️',左:'⬅️',右:'➡️',山:'⛰️',川:'🏞️',水:'💧',火:'🔥',木:'🌳',金:'🪙',土:'🌱',日:'☀️',月:'🌙',星:'⭐',天:'☁️',地:'🌍',
雨:'🌧️',雪:'❄️',風:'🌬️',雲:'☁️',花:'🌸',草:'🌿',林:'🌲',森:'🌲',石:'🪨',田:'🌾',米:'🍚',魚:'🐟',鳥:'🐦',馬:'🐴',牛:'🐮',犬:'🐶',羊:'🐑',虎:'🐯',龍:'🐉',貝:'🐚',
蟲:'🐛',耳:'👂',目:'👁️',口:'👄',手:'✋',足:'🦶',心:'❤️',力:'💪',女:'👩',男:'👨',子:'👶',父:'👨',母:'👩',老:'👴',王:'👑',學:'📚',校:'🏫',門:'🚪',家:'🏠',
國:'🏳️',韓:'🇰🇷',車:'🚗',舟:'⛵',船:'🚢',刀:'🔪',弓:'🏹',工:'🛠️',食:'🍽️',飯:'🍚',茶:'🍵',果:'🍎',竹:'🎋',衣:'👕',電:'⚡',光:'💡',音:'🎵',歌:'🎤',
書:'📖',文:'📄',字:'🔤',筆:'🖊️',道:'🛣️',海:'🌊',春:'🌷',秋:'🍂',冬:'⛄',夜:'🌃',夕:'🌇',朝:'🌅',時:'⏰',年:'📅',生:'🌱',白:'⬜',黑:'⬛',靑:'🟦',赤:'🟥',
黃:'🟨',色:'🎨',骨:'🦴',肉:'🥩',牙:'🦷',齒:'🦷',鼻:'👃',愛:'💗',友:'🤝',笑:'😄',泣:'😢',夢:'💭',樂:'🎶',見:'👀',言:'💬',語:'💬',話:'💬',行:'🚶',走:'🏃',
立:'🧍',休:'🛌',玉:'💎',卵:'🥚',乳:'🥛',菜:'🥬',桃:'🍑',栗:'🌰',梨:'🍐',鷄:'🐔',豚:'🐷',象:'🐘',熊:'🐻',鹿:'🦌',兎:'🐰',蛇:'🐍',蝶:'🦋',蜂:'🐝',

const EMO_WORD = {學校:'🏫',學生:'🧑‍🎓',先生:'👩‍🏫',大韓民國:'🇰🇷',太陽:'☀️',電話:'📞',自動車:'🚗',汽車:'🚂',飛行機:'✈️',地球:'🌍',火山:'🌋',
 海水:'🌊',花草:'🌺',登山:'🥾',食堂:'🍽️',冊床:'📚',時計:'⏰',男女:'👫',父母:'👨‍👩‍👧',兄弟:'👬',人間:'🧑‍🤝‍🧑',愛人:'💑',韓食:'🍲',音樂:'🎵',
 國旗:'🚩',雪山:'🏔️',白雪:'⛄',天氣:'🌤️',火災:'🧯',洪水:'🌊',銀行:'🏦',病院:'🏥',藥局:'💊',警察:'👮',學院:'🏫',敎室:'🏫',運動:'🏃'};
function pic(word){
  if (EMO_WORD[word]) return EMO_WORD[word];
  const e = [...word].map(h=>EMO[h]).filter(Boolean);
  return [...new Set(e)].slice(0,3).join('');
}

const clean = t => t.replace(/[^\uAC00-\uD7A3\u3400-\u9FFF]/g,'');
const isH = c => /[\u3400-\u9fff]/.test(c);

// 한자 한 글자의 (훈, 음): 읽기와 맞는 음을 우선
function charInfo(h, eum){
  const list = [...(gradeMeaning(h)||[]), ...(CH[h]||[])];
  const m = list.find(x => x.endsWith(' ' + eum)) || list[0];
  if (!m) return { hanja:h, hun:'', eum: eum||'' };
  const i = m.lastIndexOf(' ');
  return { hanja:h, hun:m.slice(0,i), eum:m.slice(i+1) };
}
// 같은 한자가 들어 있는 다른 낱말 (2글자 우선)
function related(word, reading){
  if (!RELIDX){ RELIDX = Object.entries(WD).map(([k,v])=>[k,v[0]]); }
  const set = new Set([...word]);
  const out = [];
  for (const [k,h] of RELIDX){
    if (h === word || k === reading) continue;
    if (h.length === 2 && [...h].some(c=>set.has(c))) { out.push([k,h]); if (out.length >= 400) break; }
  }
  // 앞에서부터 6개를 고르되 다양하게 섞기
  const step = Math.max(1, Math.floor(out.length / 9));
  return out.filter((_,i)=> i % step === 0).slice(0,9);
}

function render(reading, forms, idx=0){
  const word = forms[idx];
  const syl = [...reading];
  const info = [...word].map((h,i)=>charInfo(h, syl[i]));
  const big = $('big'); big.className = ''; big.textContent = word; $('pic').textContent = pic(word);
  $('reading').textContent = reading;
  $('chars').innerHTML = info.map(c=>`<div><b>${esc(c.hanja)}</b><br>${esc(c.hun)} ${esc(c.eum)}${GRADE_OF[c.hanja]?`<br>${GRADE_OF[c.hanja]}급`:''}</div>`).join('');
  say(reading);
  const rel = related(word, reading);
  $('info').innerHTML = `<h2>뜻과 쓰임</h2>
    <div class="tag">뜻풀이 (글자별 훈·음)</div>
    <p>${info.map(c=>`<b>${esc(c.hanja)}</b>(${esc(c.hun)} ${esc(c.eum)})`).join(' + ')}<br>
    → <b>${esc(reading)}</b> = ${info.map(c=>esc(c.hun||c.eum)).join(' · ')}</p>
    ${forms.length>1 ? `<div class="tag">같은 소리의 다른 한자어</div><div class="cands">${forms.map((f,i)=>`<button class="chip" data-i="${i}" ${i===idx?'style="border-color:var(--accent)"':''}>${esc(f)}</button>`).join('')}</div>`:''}
    ${rel.length ? `<div class="tag" style="margin-top:8px">같은 글자가 쓰인 말</div><ul class="cols">${rel.map(([k,h])=>`<li>${pic(h).slice(0,2)} ${esc(h)} (${esc(k)})</li>`).join('')}</ul>`:''}`;
  $('info').querySelectorAll('[data-i]').forEach(b=> b.onclick = ()=>render(reading, forms, +b.dataset.i));
}

function renderChars(syl){
  const list = CH ? Object.entries(CH).filter(([h,v])=>v.some(x=>x.endsWith(' '+syl))).sort((x,y)=>common(y[0])-common(x[0])) : [];
  $('big').className=''; $('big').textContent = list[0]?.[0] || '?'; $('pic').textContent = pic(list[0]?.[0]||'');
  $('reading').textContent = syl; say(syl);
  $('chars').innerHTML = '';
  $('info').innerHTML = `<h2>뜻과 쓰임</h2><div class="tag">'${esc(syl)}' 음을 가진 한자</div>
    <div class="cands">${list.slice(0,60).map(([h,v])=>`<button class="chip" data-h="${h}" title="${esc(v.join(', '))}">${h} ${esc(v.find(x=>x.endsWith(' '+syl)))}</button>`).join('')}</div>`;
  $('info').querySelectorAll('[data-h]').forEach(b=> b.onclick = ()=> lookupHanja(b.dataset.h));
}
let REV = null;
function lookupHanja(t){
  const hs = [...t];
  if (!REV){ REV = {}; for (const [k,v] of Object.entries(WD)) for (const h of v) (REV[h] ||= k); }
  if (hs.length > 1 && REV[t]) return render(REV[t], WD[REV[t]], WD[REV[t]].indexOf(t));
  const big = $('big'); big.className=''; big.textContent = t; $('pic').textContent = pic(t);
  const info = hs.map(h=>({hanja:h, list: gradeMeaning(h) || CH[h]||[]}));
  $('reading').innerHTML = hs.length===1 ? esc((CH[t]||[]).map(x=>x.slice(x.lastIndexOf(' ')+1)).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')) + badge(t) : '';
  $('chars').innerHTML = hs.length>1 ? info.map(c=>`<div><b>${esc(c.hanja)}</b><br>${esc(c.list[0]||'')}${GRADE_OF[c.hanja]?`<br>${GRADE_OF[c.hanja]}급`:''}</div>`).join('') : '';
  say(info.map(c=>c.list[0]||'').join(', ')); let rel = [];
  if (hs.length === 1){
    for (const [k,v] of Object.entries(WD)){ const h = v.find(x=>x.includes(t) && x.length===2); if (h) { rel.push([k,h]); if (rel.length>=300) break; } }
    const step = Math.max(1, Math.floor(rel.length/9)); rel = rel.filter((_,i)=>i%step===0).slice(0,9);
  }
  $('info').innerHTML = `<h2>뜻과 쓰임</h2><div class="tag">훈·음</div>
    <p>${info.map(c=>`<b>${esc(c.hanja)}</b>: ${c.list.length ? c.list.map(esc).join(' / ') : '사전에 없는 글자'}`).join('<br>')}</p>
    ${rel.length ? `<div class="tag">이 글자가 쓰인 말</div><ul class="cols">${rel.map(([k,h])=>`<li>${pic(h).slice(0,2)} ${esc(h)} (${esc(k)})</li>`).join('')}</ul>`:''}`;
}

function gradeMeaning(h){ for (const k in GR){ const x = GR[k].find(y=>y.h===h); if (x) return x.m; } return null; }
const badge = h => GRADE_OF[h] ? `<span class="badge">${GRADE_OF[h]}급</span>` : '';

function showGrade(g){
  const list = GR[g] || [];
  $('big').className=''; $('big').textContent = `${g}급`; $('pic').textContent = '';
  $('reading').textContent = `${list.length}자 · 눌러서 보기`; $('chars').innerHTML = '';
  $('info').innerHTML = `<h2>${g}급 한자 (${list.length}자)</h2><div class="gchips">${list.map(x=>`<button class="gc" data-h="${x.h}">${x.h}<i>${pic(x.h)}</i><small>${esc(x.m[0])}</small></button>`).join('')}</div>`;
  $('info').querySelectorAll('.gc').forEach(b=> b.onclick = ()=>{ lookup(b.dataset.h); });
  document.querySelectorAll('#grades .seg').forEach(x=>x.classList.toggle('on', x.dataset.g===String(g)));
}
document.querySelectorAll('#grades .seg').forEach(b=> b.onclick = async ()=>{ await dictReady; showGrade(b.dataset.g); });

function found(t){ return !!(WD && WD[clean(t)]) ; }

// "물 수"처럼 훈·음으로 말하면 한자를 찾는 색인 (급수 한자 우선)
let HE = null;
function buildHE(){
  HE = {};
  const add = (h,m)=>{ const k = m.replace(/\[[^\]]*\]|\([^)]*\)/g,'').replace(/[^\uAC00-\uD7A3]/g,''); if (k.length < 2) return; const a = (HE[k] ||= []); if (!a.includes(h)) a.push(h); };
  for (const [h,v] of Object.entries(CH)) v.forEach(m=>add(h,m));
  for (const g in GR) GR[g].forEach(x=>x.m.forEach(m=>add(x.h,m)));
  for (const k in HE) HE[k].sort((x,y)=>common(y)-common(x));
}
// 입력(한글)에서 한자 찾기: 훈·음 → 낱말 → 한 글자 음 → 문장 속 부분
function findMatch(t){
  if (!HE) buildHE();
  if (HE[t]) return {kind:'he', hs:HE[t], key:t};
  if (WD[t]) return {kind:'word', key:t};
  const chars = [...t];
  if (chars.length === 1) return {kind:'syl', key:t};
  for (let len = Math.min(8, chars.length - 1); len >= 2; len--){
    for (let i = 0; i + len <= chars.length; i++){
      const sub = chars.slice(i,i+len).join('');
      if (HE[sub] && (sub.length >= 3 || sub.length * 2 >= t.length)) return {kind:'he', hs:HE[sub], key:sub, from:t};
      if (WD[sub] && sub.length * 2 >= t.length) return {kind:'word', key:sub, from:t};
    }
  }
  return null;
}
async function lookup(text){
  await dictReady; seq++;
  const t = clean(text);
  if (!t){ setStatus('글자를 알아보지 못했어요.'); return; }
  if ([...t].every(isH)) return lookupHanja(t);
  const m = findMatch(t);
  if (m){
    if (m.from) setStatus(`'${m.from}'에서 '${m.key}'을(를) 찾았어요.`);
    if (m.kind === 'he'){
      if (m.hs.length > 1){
        $('cands').innerHTML = '';
        m.hs.slice(0,8).forEach(h=>{ const b = document.createElement('button'); b.className='chip'; b.textContent = h; b.onclick = ()=>lookupHanja(h); $('cands').appendChild(b); });
      }
      return lookupHanja(m.hs[0]);
    }
    if (m.kind === 'word') return render(m.key, WD[m.key]);
    return renderChars(m.key);
  }
  const sim = similarItems(t);
  if (sim.length) return similarFlow(sim);
  $('big').className='placeholder'; $('big').textContent='?'; $('pic').textContent=''; $('reading').textContent=t; $('chars').innerHTML='';
  $('info').innerHTML = '<h2>뜻과 쓰임</h2><p>사전에서 찾지 못했어요. 「물 수」「사람 인」처럼 <b>뜻과 소리</b>로 말하거나, 「학교」 같은 낱말로 말해 보세요.</p>';
}

// --- 정확한 한자를 못 찾았을 때: 비슷한 한자 안내 ---
let seq = 0; // 새 조회/읽기가 시작되면 진행 중인 안내를 멈춘다
const mainMeaning = h => (gradeMeaning(h) || CH[h] || [''])[0];
function lev1(a,b){
  if (a === b) return true;
  const la = a.length, lb = b.length; if (Math.abs(la-lb) > 1) return false;
  let i = 0; while (i < la && i < lb && a[i] === b[i]) i++;
  if (la === lb) return a.slice(i+1) === b.slice(i+1);
  return la > lb ? a.slice(i+1) === b.slice(i) : b.slice(i+1) === a.slice(i);
}
function similarItems(t){
  if (!HE) buildHE();
  const out = [], seen = new Set();
  const push = (h,label)=>{ if (h && !seen.has(h) && out.length < 6){ seen.add(h); out.push({h, label}); } };
  const near = [];
  for (const k in HE){ if (lev1(k,t)) near.push(HE[k][0]); }
  near.sort((x,y)=>common(y)-common(x)).slice(0,4).forEach(h=>push(h, mainMeaning(h)));
  let n = 0;
  if (t.length >= 2){ n = 0; for (const k in WD){ if (Math.abs(k.length - t.length) <= 1 && lev1(k,t)){ push(WD[k][0], k); if (++n >= 3) break; } } }
  for (const syl of [...t].slice(0,2)){   // 글자 소리가 같은 급수 한자
    const list = Object.entries(CH).filter(([h,v])=>v.some(x=>x.endsWith(' '+syl))).sort((x,y)=>common(y[0])-common(x[0])).slice(0,2);
    list.forEach(([h])=>push(h, mainMeaning(h)));
  }
  return out;
}
function showBig(it){
  $('big').className=''; $('big').textContent = it.h; $('pic').textContent = pic(it.h);
  $('reading').textContent = it.label; $('chars').innerHTML = ''; lastSay = it.label;
}
function speakThen(text, done){
  if (!('speechSynthesis' in window)){ setTimeout(done, 1500); return; }
  let fin = false; const go = ()=>{ if (!fin){ fin = true; done(); } };
  try{
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = +$('rate').value; u.volume = +$('vol').value;
    u.onend = go; u.onerror = go; setTimeout(go, 3000 + text.length * 450);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ go(); }
}
const SIMILAR_MSG = '정확한 한자를 찾지 못했어요. 비슷한 한자를 알려드릴게요.';
function similarFlow(items){
  const my = ++seq;
  setStatus('정확한 한자를 찾지 못했어요. 비슷한 한자를 알려드릴게요.');
  $('big').className='placeholder'; $('big').textContent='?'; $('pic').textContent=''; $('chars').innerHTML='';
  $('reading').textContent = '비슷한 한자';
  $('info').innerHTML = `<h2>비슷한 한자</h2><div class="gchips">${items.map(x=>`<button class="gc" data-h="${esc(x.h)}">${esc(x.h)}<i>${pic(x.h)}</i><small>${esc(x.label)}</small></button>`).join('')}</div>`;
  $('info').querySelectorAll('.gc').forEach(b=> b.onclick = ()=> lookup(b.dataset.h));
  const steps = items.slice(0,3);
  speakThen(SIMILAR_MSG, ()=>{
    const next = i => {
      if (my !== seq || i >= steps.length) return;
      showBig(steps[i]);
      speakThen(steps[i].label, ()=> next(i+1));
    };
    next(0);
  });
}

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// --- 읽어주기 (기기 기본 목소리) ---
let lastSay = '';
function say(text){
  seq++;
  lastSay = text || lastSay; if (!lastSay || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(lastSay); u.lang = 'ko-KR'; u.rate = +$('rate').value; u.volume = +$('vol').value; speechSynthesis.speak(u); }catch(e){}
}
// 속도·크기 설정 (이 기기에 기억)
function loadVox(){ try{ const v = JSON.parse(localStorage.getItem('hanja-vox')||'{}'); if (v.rate) $('rate').value = v.rate; if (v.vol) $('vol').value = v.vol; }catch(e){} showVox(); }
function showVox(){ $('rateV').textContent = (+$('rate').value).toFixed(1); $('volV').textContent = (+$('vol').value).toFixed(1); }
['rate','vol'].forEach(id=>{
  $(id).addEventListener('input', showVox);
  $(id).addEventListener('change', ()=>{ try{ localStorage.setItem('hanja-vox', JSON.stringify({rate:$('rate').value, vol:$('vol').value})); }catch(e){} say(lastSay || '안녕'); });
});
loadVox();
document.querySelector('.hrow').addEventListener('click', ()=>say());
$('listen').addEventListener('click', ()=>say());

function fitBig(){
  const row = document.querySelector('.hrow'), panel = row.parentElement;
  const n = [...$('big').textContent].length || 1, hasPic = !!$('pic').textContent;
  const pw = panel.clientWidth - 40, ph = panel.clientHeight;
  const units = n * 1.02 + (hasPic ? 0.2 + 0.7 * Math.min(3, [...$('pic').textContent].length > 6 ? 2 : 1.2) : 0);
  row.style.fontSize = Math.max(48, Math.min(pw / units, ph * 0.5, 230)) + 'px';
}
new MutationObserver(fitBig).observe(document.querySelector('.hrow'),{childList:true,characterData:true,subtree:true});
addEventListener('resize', fitBig); fitBig();
</script>
